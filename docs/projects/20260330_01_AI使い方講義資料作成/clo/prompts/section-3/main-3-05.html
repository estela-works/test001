<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>main-3-05</title>
  <link rel="stylesheet" href="../slide-templates/slide-template.css">
</head>
<body>
  <div class="slide theme-section-3">
    <div class="slide-head">
      <div class="slide-title">AIは暗黙知を読めない。暗黙知で回すチームは、AIに渡せる情報が少ない</div>
      <div class="slide-message">これは意志の問題ではなくコストの問題であり、だからこそ前提が変われば解ける</div>
    </div>
    <div class="slide-body">
      <div class="two-col">
        <div class="card">
          <div class="compare-label" style="color:#5d6f86;">暗黙知（人間の頭の中）</div>
          <div class="bullet-lines" style="margin-top:10px;">
            <div class="bullet-line"><span class="icon-chip" style="background:#eef3f6; color:#365166;">内</span><span>チーム外に持ち出しにくい</span></div>
            <div class="bullet-line"><span class="icon-chip" style="background:#eef3f6; color:#365166;">失</span><span>メンバー離脱で消えやすい</span></div>
            <div class="bullet-line"><span class="icon-chip" style="background:#eef3f6; color:#365166;">限</span><span>人数や組織を跨ぐと共有が難しい</span></div>
          </div>
        </div>
        <div class="card-accent card">
          <div class="compare-label">AIのコンテキスト</div>
          <div class="bullet-lines" style="margin-top:10px;">
            <div class="bullet-line"><span class="icon-chip">読</span><span>文書化された情報しか読めない</span></div>
            <div class="bullet-line"><span class="icon-chip">参</span><span>今ここに渡された情報しか参照できない</span></div>
            <div class="bullet-line"><span class="icon-chip">差</span><span>暗黙知との間に断絶がある</span></div>
          </div>
        </div>
      </div>
      <div class="lead-card">
        <div class="lead-question" style="font-size:20px;">暗黙知で回せる強いチームほど、AIには渡せる情報が少ない</div>
      </div>
    </div>
    <div class="slide-footer">
      <span>Limit Of Tacit Knowledge</span>
      <span>AI Cannot Read Your Team Memory</span>
    </div>
  </div>
</body>
</html>
