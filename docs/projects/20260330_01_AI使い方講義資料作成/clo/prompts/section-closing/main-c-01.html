<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>main-c-01</title>
  <link rel="stylesheet" href="../slide-templates/slide-template.css">
</head>
<body>
  <div class="slide theme-closing">
    <div class="slide-head">
      <div class="slide-title">本日の論理は、6章を通じて一本につながっている</div>
      <div class="slide-message">コンテキスト、SSOT、歴史、コスト構造、型、課題回収の順で積み上げてきた</div>
    </div>
    <div class="slide-body roadmap-compact section-roadmap">
      <div class="roadmap-panel" style="padding-top:10px;">
        <div class="roadmap-list" style="flex:1;">
          <div class="roadmap-item"><div class="roadmap-no">第1章</div><div class="roadmap-title">コンテキストが全て</div><div class="roadmap-desc">LLM の原理から出発した</div><div class="roadmap-now">済</div></div>
          <div class="roadmap-item"><div class="roadmap-no">第2章</div><div class="roadmap-title">現場の SSOT 欠如</div><div class="roadmap-desc">情報構造が AI に向いていないと見た</div><div class="roadmap-now">済</div></div>
          <div class="roadmap-item"><div class="roadmap-no">第3章</div><div class="roadmap-title">合理的だった歴史</div><div class="roadmap-desc">軽視ではなくトレードオフだったと整理した</div><div class="roadmap-now">済</div></div>
          <div class="roadmap-item"><div class="roadmap-no">第4章</div><div class="roadmap-title">コスト構造の逆転</div><div class="roadmap-desc">AI で前提が変わったと確認した</div><div class="roadmap-now">済</div></div>
          <div class="roadmap-item"><div class="roadmap-no">第5章</div><div class="roadmap-title">SPEC&amp;Project の型</div><div class="roadmap-desc">運用サイクルを具体化した</div><div class="roadmap-now">済</div></div>
          <div class="roadmap-item"><div class="roadmap-no">第6章</div><div class="roadmap-title">全課題へのアンサー</div><div class="roadmap-desc">AIネイティブ開発の定義まで回収した</div><div class="roadmap-now">済</div></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
