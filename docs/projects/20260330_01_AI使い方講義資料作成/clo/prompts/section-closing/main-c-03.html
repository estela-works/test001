<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>main-c-03</title>
  <link rel="stylesheet" href="../slide-templates/slide-template.css">
</head>
<body>
  <div class="slide theme-closing">
    <div class="slide-head">
      <div class="slide-title">まずは小さく始めてみてください</div>
      <div class="slide-message">1つのSPECを作り、1つのProjectで更新してみる。それで十分に始められる</div>
    </div>
    <div class="slide-body">
      <div class="action-grid" style="margin-top:0; flex:1;">
        <div class="action-card">
          <h3>1つの SPEC</h3>
          <p>今の正しい姿を、まず一箇所に固定する</p>
          <div class="thin-rule" style="margin:16px 0 12px;"></div>
          <div class="body-sm">まずは API 仕様や業務ルールなど、1つの領域だけでもよい。</div>
        </div>
        <div class="action-card">
          <h3>1つの Project</h3>
          <p>その SPEC を実際に更新する案件を一度回してみる</p>
          <div class="thin-rule" style="margin:16px 0 12px;"></div>
          <div class="body-sm">全社展開ではなく、1チーム・1案件で結果を見るところから始める。</div>
        </div>
      </div>
      <div class="token-row" style="margin-top:0;">
        <div class="outline-pill">小さく始める</div>
        <div class="arrow">→</div>
        <div class="outline-pill">1回回す</div>
        <div class="arrow">→</div>
        <div class="outline-pill">結果で広げる</div>
      </div>
      <div class="callout body" style="font-weight:700;">好循環が一度回り始めると、もう情報が散在した状態には戻りにくくなる</div>
    </div>
    <div class="slide-footer">
      <span>First Step</span>
      <span>Start Small</span>
    </div>
  </div>
</body>
</html>
