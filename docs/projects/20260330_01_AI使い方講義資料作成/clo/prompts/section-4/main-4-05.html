<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>main-4-05</title>
  <link rel="stylesheet" href="../slide-templates/slide-template.css">
</head>
<body>
  <div class="slide theme-section-4">
    <div class="slide-head">
      <div class="slide-title">同じAIでも、好循環にも悪循環にも入り得る</div>
      <div class="slide-message">暗黙知放置→コンテキスト不足→AI低品質→停滞、という逆回転に入ると抜けにくい</div>
    </div>
    <div class="slide-body">
      <div class="stack-md" style="flex:1;">
        <div class="centered">
          <div class="stack-sm centered" style="text-align:center;">
            <div class="question" style="font-size:24px;">あなたのチームはどちら？</div>
            <div class="body-sm">入口は同じAIでも、回り始めるループで結果が変わる。</div>
            <div class="outline-pill">分岐点は情報管理</div>
          </div>
        </div>
        <div class="two-col">
          <div class="mini-cycle good">
            <h3>好循環</h3>
            <div class="loop-list">
              <div class="loop-item"><span class="loop-dot">1</span><span>情報管理をする</span></div>
              <div class="loop-item"><span class="loop-dot">2</span><span>良質コンテキストを渡せる</span></div>
              <div class="loop-item"><span class="loop-dot">3</span><span>AI出力の質が上がる</span></div>
              <div class="loop-item"><span class="loop-dot">4</span><span>さらに管理が楽になる</span></div>
            </div>
          </div>
          <div class="mini-cycle bad">
            <h3>悪循環</h3>
            <div class="loop-list">
              <div class="loop-item"><span class="loop-dot">1</span><span>暗黙知のまま放置</span></div>
              <div class="loop-item"><span class="loop-dot">2</span><span>渡すコンテキストがない</span></div>
              <div class="loop-item"><span class="loop-dot">3</span><span>AI出力が低品質</span></div>
              <div class="loop-item"><span class="loop-dot">4</span><span>「AIは使えない」と判断</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="slide-footer">
      <span>Good Loop vs Bad Loop</span>
      <span>Choice Of Direction</span>
    </div>
  </div>
</body>
</html>
