<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>main-1-09</title>
  <link rel="stylesheet" href="../slide-templates/slide-template.css">
</head>
<body>
  <div class="slide theme-section-1">
    <div class="slide-head">
      <div class="slide-title">AIの出力品質を決める三つの条件</div>
      <div class="slide-message">正確・一貫・最新を満たすほど限られた枠を有効に使える</div>
    </div>
    <div class="slide-body">
      <div class="feature-grid-3" style="flex:1;">
        <div class="feature-card centered" style="flex-direction:column; text-align:center; gap:10px;">
          <div class="icon-chip" style="width:80px; height:80px; font-size:22px;">正確</div>
          <p>事実として誤っていない。曖昧な推測を事実扱いしない。</p>
        </div>
        <div class="feature-card centered" style="flex-direction:column; text-align:center; gap:10px;">
          <div class="icon-chip" style="width:80px; height:80px; font-size:22px;">一貫</div>
          <p>情報同士が矛盾していない。複数の正解候補を同時に置かない。</p>
        </div>
        <div class="feature-card centered" style="flex-direction:column; text-align:center; gap:10px;">
          <div class="icon-chip" style="width:80px; height:80px; font-size:22px;">最新</div>
          <p>古い仕様や過去の前提が混ざっていない。今の判断に使える。</p>
        </div>
      </div>
      <div class="lead-card">
        <div class="lead-question" style="font-size:22px;">同じモデルでも、限られた枠に何を入れるかで結果は劇的に変わる</div>
      </div>
    </div>
    <div class="slide-footer">
      <span>Core Principle</span>
      <span>Accurate / Consistent / Current</span>
    </div>
  </div>
</body>
</html>
