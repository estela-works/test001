<!DOCTYPE html>
<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chapter Template</title>
  <link rel="stylesheet" href="./slide-template.css">
</head>
<body>

    <div class="slide-footer">

      <span>Accent: Section Color</span>
