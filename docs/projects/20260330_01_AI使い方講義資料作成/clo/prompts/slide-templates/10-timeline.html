<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline Template</title>
  <link rel="stylesheet" href="./slide-template.css">
</head>
<body>
  <div class="slide theme-section-3">
    <div class="slide-head">
      <div class="slide-title">歴史や時系列のタイトルを書く</div>
      <div class="slide-message">何がどの順番で変わったのかを1行でまとめる</div>
    </div>
    <div class="slide-body">
      <div class="timeline-line"></div>
      <div class="timeline" style="flex:1;">
        <div class="timeline-item">
          <div class="timeline-year">1990s</div>
          <h3>時点 1</h3>
          <p>説明は1行から2行まで</p>
        </div>
        <div class="timeline-item">
          <div class="timeline-year">2000s</div>
          <h3>時点 2</h3>
          <p>説明は1行から2行まで</p>
        </div>
        <div class="timeline-item">
          <div class="timeline-year">2010s</div>
          <h3>時点 3</h3>
          <p>説明は1行から2行まで</p>
        </div>
        <div class="timeline-item">
          <div class="timeline-year">2020s</div>
          <h3>時点 4</h3>
          <p>説明は1行から2行まで</p>
        </div>
      </div>
      <div class="callout body" style="font-weight:800;">歴史から引き出す解釈を最後に1文で置く</div>
    </div>
  </div>
</body>
</html>
