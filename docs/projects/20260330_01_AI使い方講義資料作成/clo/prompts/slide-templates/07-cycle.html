<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cycle Template</title>
  <link rel="stylesheet" href="./slide-template.css">
</head>
<body>
  <div class="slide theme-section-4">
    <div class="slide-head">
      <div class="slide-title">循環や強化ループのタイトルを書く</div>
      <div class="slide-message">このループが何を加速させるかを1行で書く</div>
    </div>
    <div class="slide-body">
      <div class="diagram-board">
        <div class="cycle">
          <div class="cycle-stage">
            <svg class="cycle-arrows" viewBox="0 0 1000 520" aria-hidden="true">
              <defs>
                <marker id="cycle-arrowhead" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
                  <path d="M0,0 L7,3.5 L0,7 Z"></path>
                </marker>
              </defs>
              <ellipse class="guide" cx="500" cy="260" rx="250" ry="150"></ellipse>
              <path d="M315 145 A250 150 0 0 1 705 145" marker-end="url(#cycle-arrowhead)"></path>
              <path d="M760 205 A250 150 0 0 1 705 382" marker-end="url(#cycle-arrowhead)"></path>
              <path d="M685 405 A250 150 0 0 1 315 405" marker-end="url(#cycle-arrowhead)"></path>
              <path d="M240 315 A250 150 0 0 1 295 138" marker-end="url(#cycle-arrowhead)"></path>
            </svg>
            <div class="step-box cycle-top">
              <div class="step-no">STEP 1</div>
              <div class="step-text">最初の入力</div>
            </div>
            <div class="step-box cycle-right">
              <div class="step-no">STEP 2</div>
              <div class="step-text">出力と確認</div>
            </div>
            <div class="step-box cycle-bottom">
              <div class="step-no">STEP 3</div>
              <div class="step-text">更新と反映</div>
            </div>
            <div class="step-box cycle-left">
              <div class="step-no">STEP 4</div>
              <div class="step-text">次の改善</div>
            </div>
            <div class="cycle-center">加速する対象</div>
          </div>
        </div>
      </div>
    </div>
    <div class="slide-footer">
      <span>Cycle / Flywheel</span>
      <span>ステップは 4-5 個まで</span>
    </div>
  </div>
</body>
</html>
