<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checklist Template</title>
  <link rel="stylesheet" href="./slide-template.css">
</head>
<body>
  <div class="slide theme-section-6">
    <div class="slide-head">
      <div class="slide-title">ここまでで解けた論点を整理する</div>
      <div class="slide-message">解決済みのことだけを並べる。新しい論点は足さない。</div>
    </div>
    <div class="slide-body">
      <div class="checklist" style="flex:1;">
        <div class="check-item">
          <div class="check-no">1</div>
          <div class="body">解決したことを1つ書く</div>
          <div class="tag">第2章</div>
        </div>
        <div class="check-item">
          <div class="check-no">2</div>
          <div class="body">解決したことを1つ書く</div>
          <div class="tag">第3章</div>
        </div>
        <div class="check-item">
          <div class="check-no">3</div>
          <div class="body">解決したことを1つ書く</div>
          <div class="tag">第4章</div>
        </div>
        <div class="check-item">
          <div class="check-no">4</div>
          <div class="body">解決したことを1つ書く</div>
          <div class="tag">第5章</div>
        </div>
        <div class="check-item">
          <div class="check-no">5</div>
          <div class="body">最後の論点を1つ書く</div>
          <div class="tag">第6章</div>
        </div>
      </div>
    </div>
    <div class="slide-footer">
      <span>Checklist Slide</span>
      <span>最大 5 項目</span>
    </div>
  </div>
</body>
</html>
