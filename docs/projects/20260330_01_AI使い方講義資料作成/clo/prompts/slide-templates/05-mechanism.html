<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mechanism Template</title>
  <link rel="stylesheet" href="./slide-template.css">
</head>
<body>
  <div class="slide theme-section-1">
    <div class="slide-head">
      <div class="slide-title">仕組みのタイトルを書く</div>
      <div class="slide-message">図の読み終わりで理解してほしいことを1行で置く</div>
    </div>
    <div class="slide-body">
      <div class="diagram-board">
        <div class="token-row">
          <div class="token">入力 1</div>
          <div class="arrow">→</div>
          <div class="token">入力 2</div>
          <div class="arrow">→</div>
          <div class="token">入力 3</div>
          <div class="arrow">→</div>
          <div class="token prediction">予測対象</div>
        </div>
        <div class="center-note">つまり、この図で言いたいことをここに1文で書く</div>
      </div>
    </div>
    <div class="slide-footer">
      <span>Mechanism Diagram</span>
      <span>ノードは 5-7 個まで</span>
    </div>
  </div>
</body>
</html>
