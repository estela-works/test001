<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Closing Template</title>
  <link rel="stylesheet" href="./slide-template.css">
</head>
<body>
  <div class="slide dark theme-closing">
    <div class="center-stack">
      <div class="quote-mark">“</div>
      <div class="quote">最後に残したいメッセージを大きく置く。長くても2文まで。</div>
      <div class="accent-rule"></div>
      <div class="quote-sub">補足や行動提案を短く1行だけ置く。締めでは図を増やさない。</div>
    </div>
    <div class="slide-footer">
      <span>Closing / Quote Slide</span>
      <span>Dark Background Allowed</span>
    </div>
  </div>
</body>
</html>
