<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Roadmap Template</title>
  <link rel="stylesheet" href="./slide-template.css">
</head>
<body>
  <div class="slide theme-section-0">
    <div class="slide-head">
      <div class="slide-title">ロードマップのタイトルを書く</div>
      <div class="slide-message">この一覧を通じて何を理解してほしいかを1行で書く</div>
    </div>
    <div class="slide-body roadmap-compact">
      <div class="lead-card">
        <div class="lead-question">この章や講義で答えたい問いを書く</div>
        <div class="lead-support">補足は1行だけ。ここは見出しではなく、ロードマップに入る前の導入として扱う。</div>
      </div>
      <div class="roadmap-arrow">↓</div>
      <div class="roadmap-panel">
        <div class="roadmap-list" style="flex:1;">
          <div class="roadmap-item">
            <div class="roadmap-no">第1章</div>
            <div class="roadmap-title">章タイトル</div>
            <div class="roadmap-desc">短い説明をここに書く</div>
            <div class="roadmap-now">今はここ</div>
          </div>
          <div class="roadmap-item">
            <div class="roadmap-no">第2章</div>
            <div class="roadmap-title">章タイトル</div>
            <div class="roadmap-desc">短い説明をここに書く</div>
            <div></div>
          </div>
          <div class="roadmap-item">
            <div class="roadmap-no">第3章</div>
            <div class="roadmap-title">章タイトル</div>
            <div class="roadmap-desc">短い説明をここに書く</div>
            <div></div>
          </div>
          <div class="roadmap-item">
            <div class="roadmap-no">第4章</div>
            <div class="roadmap-title">章タイトル</div>
            <div class="roadmap-desc">短い説明をここに書く</div>
            <div></div>
          </div>
          <div class="roadmap-item">
            <div class="roadmap-no">第5章</div>
            <div class="roadmap-title">章タイトル</div>
            <div class="roadmap-desc">短い説明をここに書く</div>
            <div></div>
          </div>
          <div class="roadmap-item">
            <div class="roadmap-no">第6章</div>
            <div class="roadmap-title">章タイトル</div>
            <div class="roadmap-desc">短い説明をここに書く</div>
            <div></div>
          </div>
        </div>
      </div>
      <div class="roadmap-bridge">
        <div class="body">次に見る観点をここに1文で置く</div>
        <div class="arrow">→</div>
      </div>
    </div>
  </div>
</body>
</html>
