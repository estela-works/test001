<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Question Template</title>
  <link rel="stylesheet" href="./slide-template.css">
</head>
<body>
  <div class="slide theme-section-0">
    <div class="slide-head">
      <div class="slide-title">問いのタイトルを書く</div>
      <div class="slide-message">この問いで観客の思考をどこへ動かすかを1行で書く</div>
    </div>
    <div class="slide-body">
      <div class="lead-card">
        <div class="lead-question">観客に投げたい問いを書く。長くても2行まで。</div>
        <div class="lead-support">問いの補足や前提は1行だけ添える。ここも主張ではなく導入に留める。</div>
      </div>
      <div class="question-panel">
        <div class="misconception-list card">
          <div class="misconception">
            <span>よくある誤解その1を書く</span>
            <span class="mark-x">X</span>
          </div>
          <div class="misconception">
            <span>よくある誤解その2を書く</span>
            <span class="mark-x">X</span>
          </div>
        </div>
        <div class="body" style="font-weight:700;">→ どちらも違う</div>
      </div>
      <div class="callout big-conclusion">このスライドの結論を1文だけ置く</div>
    </div>
    <div class="slide-footer">
      <span>Question Slide</span>
      <span>誤解は最大2個</span>
    </div>
  </div>
</body>
</html>
