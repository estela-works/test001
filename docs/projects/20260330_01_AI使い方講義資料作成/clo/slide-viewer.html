<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slide Viewer - AIネイティブ開発</title>
<base href="./">
<style>
  :root { --primary: #28AA3C; --dark: #1E352A; --bg: #1a1a2e; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); color: #fff; font-family: "Noto Sans JP","Meiryo",sans-serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }

  .topbar {
    display: flex; align-items: center; gap: 10px;
    padding: 6px 14px; background: #16162a; border-bottom: 1px solid #333; flex-shrink: 0;
  }
  .topbar h1 { font-size: 13px; color: var(--primary); white-space: nowrap; }
  .section-tabs { display: flex; gap: 3px; overflow-x: auto; scrollbar-width: thin; }
  .section-tab {
    padding: 3px 9px; font-size: 11px; border-radius: 4px;
    background: #2a2a4a; color: #999; border: none; cursor: pointer; white-space: nowrap; transition: all 0.15s;
  }
  .section-tab:hover { background: #3a3a5a; color: #fff; }
  .section-tab.active { background: var(--primary); color: #fff; }
  .counter { margin-left: auto; font-size: 12px; color: #666; white-space: nowrap; font-variant-numeric: tabular-nums; }

  .main {
    flex: 1; position: relative; min-height: 0; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    padding: 12px 56px 20px;
  }

  .slide-wrapper {
    width: 1024px; height: 576px;
    transform-origin: center center;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    line-height: 0;
  }
  .slide-frame {
    border: none; background: #fff;
    box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    width: 1024px; height: 576px;
    overflow: hidden;
    display: block;
  }

  .nav-btn {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 10;
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(40,170,60,0.15); border: 2px solid rgba(40,170,60,0.3);
    color: var(--primary); font-size: 18px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: all 0.15s;
  }
  .nav-btn:hover { background: var(--primary); color: #fff; }
  .nav-btn:disabled { opacity: 0.15; pointer-events: none; }
  .nav-prev { left: 8px; }
  .nav-next { right: 8px; }

  .bottombar {
    display: flex; align-items: center; gap: 10px;
    padding: 5px 14px; background: #16162a; border-top: 1px solid #333; flex-shrink: 0;
  }
  .slide-name { font-size: 13px; color: var(--primary); font-weight: bold; }
  .section-label { font-size: 11px; color: #666; }
  .progress-bar { flex: 1; height: 3px; background: #2a2a4a; border-radius: 2px; margin: 0 8px; cursor: pointer; position: relative; }
  .progress-fill { height: 100%; background: var(--primary); border-radius: 2px; transition: width 0.2s; }
  .kbd-hint { font-size: 9px; color: #444; white-space: nowrap; }
  .kbd { display: inline-block; padding: 0 4px; background: #2a2a4a; border-radius: 2px; font-size: 9px; color: #666; margin: 0 1px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>Slide Viewer</h1>
  <div class="section-tabs" id="tabs"></div>
  <div class="counter" id="counter"></div>
</div>

<div class="main">
  <button class="nav-btn nav-prev" id="prevBtn">&#9664;</button>
  <div class="slide-wrapper" id="wrapper">
    <iframe class="slide-frame" id="frame" src="" scrolling="no"></iframe>
  </div>
  <button class="nav-btn nav-next" id="nextBtn">&#9654;</button>
</div>

<div class="bottombar">
  <span class="slide-name" id="name"></span>
  <span class="section-label" id="secLabel"></span>
  <div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
  <span class="kbd-hint"><span class="kbd">&larr;</span><span class="kbd">&rarr;</span> nav <span class="kbd">F</span> full <span class="kbd">Home</span><span class="kbd">End</span></span>
</div>

<script>
  // Data is loaded from external JSON via fetch, with inline fallback
  let slides = [], sections = [], current = 0;
  let frameWidth = 1072, frameHeight = 624;

  function applyFrameSize(width, height) {
    frameWidth = width;
    frameHeight = height;
    const wrapper = document.getElementById('wrapper');
    const frame = document.getElementById('frame');
    wrapper.style.width = width + 'px';
    wrapper.style.height = height + 'px';
    frame.style.width = width + 'px';
    frame.style.height = height + 'px';
  }

  function measureFrameContent() {
    const frame = document.getElementById('frame');
    try {
      const doc = frame.contentDocument;
      if (!doc) return;
      const root = doc.documentElement;
      const body = doc.body;
      if (!root || !body) return;

      const width = Math.max(
        root.scrollWidth, root.offsetWidth, root.clientWidth,
        body.scrollWidth, body.offsetWidth, body.clientWidth
      );
      const height = Math.max(
        root.scrollHeight, root.offsetHeight, root.clientHeight,
        body.scrollHeight, body.offsetHeight, body.clientHeight
      );

      if (width > 0 && height > 0) {
        applyFrameSize(width, height);
        rescale();
      }
    } catch (_) {
      // Ignore sizing when iframe content cannot be measured.
    }
  }

  function loadData() {
    const data = {"slides": [{"name": "main-0-01", "section": "section-0", "path": "prompts/section-0/main-0-01.html"}, {"name": "main-0-02", "section": "section-0", "path": "prompts/section-0/main-0-02.html"}, {"name": "main-0-03", "section": "section-0", "path": "prompts/section-0/main-0-03.html"}, {"name": "main-0-04", "section": "section-0", "path": "prompts/section-0/main-0-04.html"}, {"name": "main-0-05", "section": "section-0", "path": "prompts/section-0/main-0-05.html"}, {"name": "main-0-06", "section": "section-0", "path": "prompts/section-0/main-0-06.html"}, {"name": "main-1-01", "section": "section-1", "path": "prompts/section-1/main-1-01.html"}, {"name": "main-1-02", "section": "section-1", "path": "prompts/section-1/main-1-02.html"}, {"name": "main-1-03", "section": "section-1", "path": "prompts/section-1/main-1-03.html"}, {"name": "main-1-04", "section": "section-1", "path": "prompts/section-1/main-1-04.html"}, {"name": "main-1-05", "section": "section-1", "path": "prompts/section-1/main-1-05.html"}, {"name": "main-1-06", "section": "section-1", "path": "prompts/section-1/main-1-06.html"}, {"name": "main-1-07", "section": "section-1", "path": "prompts/section-1/main-1-07.html"}, {"name": "main-1-08", "section": "section-1", "path": "prompts/section-1/main-1-08.html"}, {"name": "main-1-09", "section": "section-1", "path": "prompts/section-1/main-1-09.html"}, {"name": "main-1-10", "section": "section-1", "path": "prompts/section-1/main-1-10.html"}, {"name": "main-2-01", "section": "section-2", "path": "prompts/section-2/main-2-01.html"}, {"name": "main-2-02", "section": "section-2", "path": "prompts/section-2/main-2-02.html"}, {"name": "main-2-03", "section": "section-2", "path": "prompts/section-2/main-2-03.html"}, {"name": "main-2-04", "section": "section-2", "path": "prompts/section-2/main-2-04.html"}, {"name": "main-2-05", "section": "section-2", "path": "prompts/section-2/main-2-05.html"}, {"name": "main-2-06", "section": "section-2", "path": "prompts/section-2/main-2-06.html"}, {"name": "main-2-07", "section": "section-2", "path": "prompts/section-2/main-2-07.html"}, {"name": "main-2-08", "section": "section-2", "path": "prompts/section-2/main-2-08.html"}, {"name": "main-2-09", "section": "section-2", "path": "prompts/section-2/main-2-09.html"}, {"name": "main-3-01", "section": "section-3", "path": "prompts/section-3/main-3-01.html"}, {"name": "main-3-02", "section": "section-3", "path": "prompts/section-3/main-3-02.html"}, {"name": "main-3-04", "section": "section-3", "path": "prompts/section-3/main-3-04.html"}, {"name": "main-3-05", "section": "section-3", "path": "prompts/section-3/main-3-05.html"}, {"name": "main-3-06", "section": "section-3", "path": "prompts/section-3/main-3-06.html"}, {"name": "main-4-01", "section": "section-4", "path": "prompts/section-4/main-4-01.html"}, {"name": "main-4-02", "section": "section-4", "path": "prompts/section-4/main-4-02.html"}, {"name": "main-4-03", "section": "section-4", "path": "prompts/section-4/main-4-03.html"}, {"name": "main-4-04", "section": "section-4", "path": "prompts/section-4/main-4-04.html"}, {"name": "main-4-07", "section": "section-4", "path": "prompts/section-4/main-4-07.html"}, {"name": "main-4-08", "section": "section-4", "path": "prompts/section-4/main-4-08.html"}, {"name": "main-5-01", "section": "section-5", "path": "prompts/section-5/main-5-01.html"}, {"name": "main-5-02", "section": "section-5", "path": "prompts/section-5/main-5-02.html"}, {"name": "main-5-03", "section": "section-5", "path": "prompts/section-5/main-5-03.html"}, {"name": "main-5-04", "section": "section-5", "path": "prompts/section-5/main-5-04.html"}, {"name": "main-5-05", "section": "section-5", "path": "prompts/section-5/main-5-05.html"}, {"name": "main-5-07", "section": "section-5", "path": "prompts/section-5/main-5-07.html"}, {"name": "main-5-09", "section": "section-5", "path": "prompts/section-5/main-5-09.html"}, {"name": "main-5-10", "section": "section-5", "path": "prompts/section-5/main-5-10.html"}, {"name": "main-6-01", "section": "section-6", "path": "prompts/section-6/main-6-01.html"}, {"name": "main-6-03", "section": "section-6", "path": "prompts/section-6/main-6-03.html"}, {"name": "main-6-04", "section": "section-6", "path": "prompts/section-6/main-6-04.html"}, {"name": "main-c-01", "section": "section-closing", "path": "prompts/section-closing/main-c-01.html"}, {"name": "main-c-02", "section": "section-closing", "path": "prompts/section-closing/main-c-02.html"}, {"name": "main-c-03", "section": "section-closing", "path": "prompts/section-closing/main-c-03.html"}, {"name": "main-c-04", "section": "section-closing", "path": "prompts/section-closing/main-c-04.html"}], "sections": [{"key": "section-0", "label": "0. 導入", "start": 0}, {"key": "section-1", "label": "1. LLM基礎", "start": 6}, {"key": "section-2", "label": "2. LLM課題", "start": 16}, {"key": "section-3", "label": "3. 歴史的課題", "start": 25}, {"key": "section-4", "label": "4. コスト構造", "start": 30}, {"key": "section-5", "label": "5. SPEC&Project", "start": 36}, {"key": "section-6", "label": "6. 有効性", "start": 44}, {"key": "section-closing", "label": "Closing", "start": 47}]};
    slides = data.slides;
    sections = data.sections;
    buildUI();
    goTo(0);
  }

  function resolveSlidePath(path) {
    return new URL(path, document.baseURI).href;
  }

  function buildUI() {
    const tabs = document.getElementById('tabs');
    sections.forEach(sec => {
      const btn = document.createElement('button');
      btn.className = 'section-tab';
      btn.textContent = sec.label;
      btn.onclick = () => goTo(sec.start);
      btn._secKey = sec.key;
      tabs.appendChild(btn);
    });

    document.getElementById('prevBtn').onclick = () => goTo(current - 1);
    document.getElementById('nextBtn').onclick = () => goTo(current + 1);

    document.getElementById('progressBar').onclick = (e) => {
      const rect = e.currentTarget.getBoundingClientRect();
      const pct = (e.clientX - rect.left) / rect.width;
      goTo(Math.round(pct * (slides.length - 1)));
    };
  }

  function goTo(idx) {
    if (idx < 0 || idx >= slides.length) return;
    current = idx;
    const s = slides[current];

    const frame = document.getElementById('frame');
    frame.onload = () => requestAnimationFrame(measureFrameContent);
    frame.src = resolveSlidePath(s.path);
    document.getElementById('name').textContent = s.name;
    document.getElementById('counter').textContent = (current + 1) + ' / ' + slides.length;

    let secLabel = '';
    for (let i = sections.length - 1; i >= 0; i--) {
      if (current >= sections[i].start) { secLabel = sections[i].label; break; }
    }
    document.getElementById('secLabel').textContent = secLabel;

    const pct = slides.length > 1 ? (current / (slides.length - 1)) * 100 : 0;
    document.getElementById('progressFill').style.width = pct + '%';

    document.querySelectorAll('.section-tab').forEach(tab => {
      const sec = sections.find(s => s.key === tab._secKey);
      const secIdx = sections.indexOf(sec);
      const nextStart = secIdx < sections.length - 1 ? sections[secIdx + 1].start : slides.length;
      tab.classList.toggle('active', current >= sec.start && current < nextStart);
    });

    document.getElementById('prevBtn').disabled = current === 0;
    document.getElementById('nextBtn').disabled = current === slides.length - 1;
  }

  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') { e.preventDefault(); goTo(current + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); goTo(current - 1); }
    else if (e.key === 'Home') { e.preventDefault(); goTo(0); }
    else if (e.key === 'End') { e.preventDefault(); goTo(slides.length - 1); }
    else if (e.key === 'f' || e.key === 'F') {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
  });

  function rescale() {
    const main = document.querySelector('.main');
    const styles = getComputedStyle(main);
    const padX = parseFloat(styles.paddingLeft) + parseFloat(styles.paddingRight);
    const padY = parseFloat(styles.paddingTop) + parseFloat(styles.paddingBottom);
    const availW = main.clientWidth - padX;
    const availH = main.clientHeight - padY;
    const scale = Math.max(0, Math.min(availW / frameWidth, availH / frameHeight));
    document.getElementById('wrapper').style.transform = 'scale(' + scale + ')';
  }

  window.addEventListener('resize', rescale);
  document.addEventListener('fullscreenchange', () => setTimeout(rescale, 100));

  applyFrameSize(frameWidth, frameHeight);
  loadData();
  requestAnimationFrame(rescale);
</script>
</body>
</html>
