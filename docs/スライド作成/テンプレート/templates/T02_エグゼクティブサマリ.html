<!-- ============================================================
     T-02 エグゼクティブサマリ
     一言   : 忙しい決裁者に、先に全部渡す
     使う局面: 表紙の直後。長い資料では末尾にも再掲（一人歩き対策・原則7）
     メッセージラインの型:
       〈結論〉です。理由は〈3点〉です
     情報量の上限: 結論は1文。根拠は3点。軽量版も3点のまま説明を1行に
     使ってはいけない場面: 全体で5枚未満の資料（サマリのほうが本編より長くなる）
     定義書  : プロジェクト/_完了/20260824_スライドテンプレート製作/02_16パターン定義_20260824.md T-02
     ------------------------------------------------------------
     使い方: 〈  〉を置き換える。行を減らすのは可、増やすのは上限まで。
     軽量版（中小企業の経営者向け）にするには、<section> に slide--lite を足し、
     減らす要素に class="lite-hide" を付ける。
     ============================================================ -->

<section class="slide">
  <div class="s-topic">エグゼクティブサマリー</div>
  <h2 class="s-title">〈結論を1文で。45〜50文字・2行以内〉</h2>
  <div class="s-rule"></div>
  <div class="s-body">
    <div class="sum-conc">
      <div class="sum-conc-label">ご提案の結論</div>
      <div class="sum-conc-text">〈相手が社内でそのまま言える形の1文〉</div>
    </div>
    <div class="sum-reasons">
      <div>
        <div class="sum-no">1</div>
        <div class="sum-h">〈根拠1の見出し〉</div>
        <div class="sum-t">〈2行で補足〉</div>
      </div>
      <div>
        <div class="sum-no">2</div>
        <div class="sum-h">〈根拠2の見出し〉</div>
        <div class="sum-t">〈2行で補足〉</div>
      </div>
      <div>
        <div class="sum-no">3</div>
        <div class="sum-h">〈根拠3の見出し〉</div>
        <div class="sum-t">〈2行で補足〉</div>
      </div>
    </div>
  </div>
  <div class="s-foot">
    <div class="s-src">出典: 〈出典・確認日〉</div>
    <div class="s-page">〈N〉</div>
  </div>
</section>

<div class="notes"><span class="notes-label">SPEAKER NOTES</span>
<b>ここで結論を全部渡す。</b>決裁者が途中退席してもこの1枚が残れば伝わる。<b>目次を書かないこと</b>——目次は「何を話すか」、サマリは「何が言えるか」。</div>
