<!-- ============================================================
     T-03 ワンメッセージ
     一言   : 最重要の1点を突きつける
     使う局面: Q1「これは自分に関係あるのか」。相手を当事者にする瞬間
     メッセージラインの型:
       〈相手の対象〉は、すでに〈状態〉です ← 主語を相手にする
     情報量の上限: 本文は1文だけ。補足は1行。図を置かない
     使ってはいけない場面: 根拠をまだ何も出していない段階で断定だけするとき（次のページで必ず受ける）
     定義書  : プロジェクト/_完了/20260824_スライドテンプレート製作/02_16パターン定義_20260824.md T-03
     ------------------------------------------------------------
     使い方: 〈  〉を置き換える。行を減らすのは可、増やすのは上限まで。
     軽量版（中小企業の経営者向け）にするには、<section> に slide--lite を足し、
     減らす要素に class="lite-hide" を付ける。
     ============================================================ -->

<section class="slide slide--one">
  <div class="s-topic">〈対象〉の現状</div>
  <h2 class="s-title">〈相手の対象〉は、すでに〈状態〉です</h2>
  <div class="s-rule"></div>
  <div class="s-body">
    <div class="one-msg">〈短く言い切る1文。<em>強調したい語</em>は em で囲む〉</div>
    <div class="one-sub">〈補足を1行だけ〉</div>
  </div>
  <div class="s-foot">
    <div class="s-src">出典: 〈出典・確認日〉</div>
    <div class="s-page">〈N〉</div>
  </div>
</section>

<div class="notes"><span class="notes-label">SPEAKER NOTES</span>
<b>相手を当事者にする瞬間。ここで一拍おく。</b>一般論ではなく<b>相手固有の事実</b>だから刺さる。次ページで必ず根拠を出すので、ここは断定してよい。</div>
