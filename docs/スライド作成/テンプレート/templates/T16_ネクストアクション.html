<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>T-16 ネクストアクション — ESTELA WORKS スライドテンプレート</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/slide.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<!-- ============================================================
     T-16 ネクストアクション
     一言   : 決めさせる／動かす
     使う局面: Q8。最終ページ
     メッセージラインの型:
       まずは〈最小の一歩〉から始めていただけます
     情報量の上限: 3件（軽量版1件）。4件以上は相手が持ち帰れない
     使ってはいけない場面: 相手に決裁権がないとき（→「社内でご説明いただく材料」として構成し直す）
     定義書  : プロジェクト/_完了/20260824_スライドテンプレート製作/02_16パターン定義_20260824.md T-16
     ------------------------------------------------------------
     使い方: 〈  〉を置き換える。行を減らすのは可、増やすのは上限まで。
     軽量版（中小企業の経営者向け）にするには、<section> に slide--lite を足し、
     減らす要素に class="lite-hide" を付ける。
     ============================================================ -->

<section class="slide">
  <div class="s-topic">次のステップ</div>
  <h2 class="s-title">まずは〈最小の一歩〉から始めていただけます</h2>
  <div class="s-rule"></div>
  <div class="s-body">
    <div class="next">
      <!-- 1件目＝最小の一歩。ここだけ強調する -->
      <div class="next-row next-row--first">
        <div class="next-no">1</div>
        <div class="next-what">〈最小の一歩〉</div>
        <div class="next-meta">担当: <b>〈担当〉</b></div>
        <div class="next-meta">期限: <b>〈YYYY年M月D日〉</b></div>
      </div>
      <div class="next-row lite-hide">
        <div class="next-no">2</div>
        <div class="next-what">〈やること2〉</div>
        <div class="next-meta">担当: <b>〈担当〉</b></div>
        <div class="next-meta">期限: <b>〈期限〉</b></div>
      </div>
      <div class="next-row lite-hide">
        <div class="next-no">3</div>
        <div class="next-what">〈やること3〉</div>
        <div class="next-meta">担当: <b>〈担当〉</b></div>
        <div class="next-meta">期限: <b>〈期限〉</b></div>
      </div>
    </div>
  </div>
  <div class="s-foot">
    <div class="s-src">出典: 〈出典・確認日〉</div>
    <div class="s-page">〈N〉</div>
  </div>
</section>

<div class="notes"><span class="notes-label">SPEAKER NOTES</span>
<b>「ご検討ください」で終わらない。</b>日付と担当のない依頼は実行されない。<b>最初の1件を最小にする</b>と、相手が社内承認なしで動ける。</div>

</body>
</html>
