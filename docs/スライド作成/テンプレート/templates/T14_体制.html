<!-- ============================================================
     T-14 体制・役割
     一言   : 誰がやるのかに答える
     使う局面: Q5。特に「人がいない」という懸念への直接の回答
     メッセージラインの型:
       〈作業〉は〈担当〉が行い、貴社の負担は〈範囲〉に限られます
     情報量の上限: 役割4つ（軽量版3つ）
     使ってはいけない場面: 相手側の担当者が未定のとき（空欄で出さず「ご指名をお願いする役割」と明記する）
     定義書  : プロジェクト/_完了/20260824_スライドテンプレート製作/02_16パターン定義_20260824.md T-14
     ------------------------------------------------------------
     使い方: 〈  〉を置き換える。行を減らすのは可、増やすのは上限まで。
     軽量版（中小企業の経営者向け）にするには、<section> に slide--lite を足し、
     減らす要素に class="lite-hide" を付ける。
     ============================================================ -->

<section class="slide">
  <div class="s-topic">実施体制と役割分担</div>
  <h2 class="s-title">〈作業〉は弊社が行い、貴社のご負担は〈範囲〉に限られます</h2>
  <div class="s-rule"></div>
  <div class="s-body">
    <div class="roles">
      <div class="role role--own">
        <div class="role-side">弊社</div>
        <div class="role-name">〈役割名〉</div>
        <div class="role-tasks">〈担当する作業〉</div>
        <div class="role-load">稼働: 〈目安〉</div>
      </div>
      <div class="role">
        <div class="role-side">貴社</div>
        <div class="role-name">〈部門名〉</div>
        <div class="role-tasks">〈担当する作業〉</div>
        <div class="role-load">ご負担: 〈時間〉</div>
      </div>
      <div class="role">
        <div class="role-side">貴社</div>
        <div class="role-name">〈部門名〉</div>
        <div class="role-tasks">〈担当する作業〉</div>
        <div class="role-load">ご負担: 〈時間〉</div>
      </div>
    </div>
  </div>
  <div class="s-foot">
    <div class="s-src">出典: 〈出典・確認日〉</div>
    <div class="s-page">〈N〉</div>
  </div>
</section>

<div class="notes"><span class="notes-label">SPEAKER NOTES</span>
<b>相手の工数を書かないと「丸投げできる」と誤解され、後で必ず揉める。</b>明示することが、むしろ信頼につながる。</div>

</body>
