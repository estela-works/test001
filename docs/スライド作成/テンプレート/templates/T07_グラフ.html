<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>T-07 グラフ — ESTELA WORKS スライドテンプレート</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/slide.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<!-- ============================================================
     T-07 グラフ
     一言   : 傾向・構成・ギャップ・脱落をデータで示す
     使う局面: Q2・Q3
     メッセージラインの型:
       推移「〈対象〉は〈期間〉で〈方向〉しています」／要因分解「〈差分〉の〈割合〉は〈要因〉で説明できます」
     情報量の上限: 系列は4つまで（軽量版2つ）。凡例は直接ラベルにして省略
     使ってはいけない場面: 数値が3つ以下のとき（→T-05のほうが速い）。円グラフは使わない
     定義書  : プロジェクト/_完了/20260824_スライドテンプレート製作/02_16パターン定義_20260824.md T-07
     ------------------------------------------------------------
     使い方: 〈  〉を置き換える。行を減らすのは可、増やすのは上限まで。
     軽量版（中小企業の経営者向け）にするには、<section> に slide--lite を足し、
     減らす要素に class="lite-hide" を付ける。
     ============================================================ -->

<!-- ▼ バリアント: bar / line / waterfall / funnel / stacked
     SVG は viewBox="0 0 660 330" で作る。色は #15C176（強調）と #c9d2ce（地）の2色に抑える。
     ------------------------------------------------------------ -->
<section class="slide">
  <div class="s-topic">〈対象〉の推移</div>
  <h2 class="s-title">〈グラフから言えることを1文で。グラフ名を書かない〉</h2>
  <div class="s-rule"></div>
  <div class="s-body">
    <div class="chart-wrap">
      <svg class="chart" viewBox="0 0 660 330" role="img" aria-label="〈グラフの説明〉">
        <!-- 目盛線 -->
        <line x1="70" y1="78"  x2="640" y2="78"  stroke="#e3e8e6" stroke-width="1"/>
        <line x1="70" y1="155" x2="640" y2="155" stroke="#e3e8e6" stroke-width="1"/>
        <line x1="70" y1="232" x2="640" y2="232" stroke="#e3e8e6" stroke-width="1"/>
        <text x="58" y="83"  text-anchor="end" font-size="14">〈上〉</text>
        <text x="58" y="160" text-anchor="end" font-size="14">〈中〉</text>
        <text x="58" y="237" text-anchor="end" font-size="14">〈下〉</text>
        <text x="20" y="30" font-size="14">〈単位〉</text>
        <!-- 軸 -->
        <line x1="70" y1="270" x2="640" y2="270" stroke="#c9d2ce" stroke-width="2"/>
        <!-- ▼ ここにデータを描く（例: 折れ線） -->
        <polyline points="70,232 184,216 298,201 412,147 526,109 640,78"
                  fill="none" stroke="#15C176" stroke-width="4"
                  stroke-linejoin="round" stroke-linecap="round"/>
        <circle cx="640" cy="78" r="8" fill="#088F5A"/>
        <!-- 端点の値だけ大きく（強調は重要点だけ）。Y軸の目盛と重なる位置には置かない -->
        <text class="c-val" x="640" y="60" text-anchor="middle" font-size="19">〈値〉</text>
        <!-- X軸ラベル -->
        <text x="70"  y="296" text-anchor="middle" font-size="15">〈1〉</text>
        <text x="184" y="296" text-anchor="middle" font-size="15">〈2〉</text>
        <text x="298" y="296" text-anchor="middle" font-size="15">〈3〉</text>
        <text x="412" y="296" text-anchor="middle" font-size="15">〈4〉</text>
        <text x="526" y="296" text-anchor="middle" font-size="15">〈5〉</text>
        <text x="640" y="296" text-anchor="middle" font-size="15">〈6〉</text>
      </svg>
      <div class="callout">
        <div class="callout-h">〈このグラフで最も言いたい1文〉</div>
        <div class="callout-t">〈なぜそう読めるのかを2〜3行で〉</div>
      </div>
    </div>
  </div>
  <div class="s-foot">
    <div class="s-src">出典: 〈出典・確認日〉</div>
    <div class="s-page">〈N〉</div>
  </div>
</section>

<div class="notes"><span class="notes-label">SPEAKER NOTES</span>
<b>グラフは読ませるものではなく、主張を裏づける証拠。</b>だから右に解釈を必ず置く。系列は4つまで。</div>

</body>
</html>
