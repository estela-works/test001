<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>T-08 対比 — ESTELA WORKS スライドテンプレート</title>
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/slide.css">
<link rel="stylesheet" href="../css/components.css">
</head>
<body>

<!-- ============================================================
     T-08 対比
     一言   : 現在と、その先を並べて差を見せる
     使う局面: Q3・Q4。「どうすればいいのか」の答えを形にする
     メッセージラインの型:
       現在の〈状態〉から、〈期間〉で〈状態〉へ移せます
     情報量の上限: 対比項目は4行（軽量版3行）。左右で行数を必ず一致させる
     使ってはいけない場面: 到達側が願望でしかないとき（右側にも根拠＝期間・条件を書く）
     定義書  : プロジェクト/_完了/20260824_スライドテンプレート製作/02_16パターン定義_20260824.md T-08
     ------------------------------------------------------------
     使い方: 〈  〉を置き換える。行を減らすのは可、増やすのは上限まで。
     軽量版（中小企業の経営者向け）にするには、<section> に slide--lite を足し、
     減らす要素に class="lite-hide" を付ける。
     ============================================================ -->

<!-- ▼ バリアント1: lr（左右 ＝ As-Is / To-Be）★左が現状、右が到達（視線は左→右） -->
<section class="slide">
  <div class="s-topic">〈対象〉の現状と移行後</div>
  <h2 class="s-title">現在の〈状態〉から、〈期間〉で〈状態〉へ移せます</h2>
  <div class="s-rule"></div>
  <div class="s-body">
    <div class="gap">
      <div class="gap-panel">
        <div class="gap-label">現在 — AS IS</div>
        <div class="gap-list">
          <div class="gap-item">〈現状1〉</div>
          <div class="gap-item">〈現状2〉</div>
          <div class="gap-item">〈現状3〉</div>
          <div class="gap-item lite-hide">〈現状4〉</div>
        </div>
      </div>
      <div class="gap-arrow">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <path d="M6 20h22M22 12l8 8-8 8" fill="none" stroke="#15C176" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="gap-panel to">
        <div class="gap-label">〈期間〉後 — TO BE</div>
        <div class="gap-list">
          <div class="gap-item">〈到達1：現状1と対応させる〉</div>
          <div class="gap-item">〈到達2〉</div>
          <div class="gap-item">〈到達3〉</div>
          <div class="gap-item lite-hide">〈到達4〉</div>
        </div>
      </div>
    </div>
  </div>
  <div class="s-foot">
    <div class="s-src">出典: 〈出典・確認日〉</div>
    <div class="s-page">〈N〉</div>
  </div>
</section>

<!-- ▼ バリアント2: tb（上下 ＝ Before / After） -->
<section class="slide">
  <div class="s-topic">〈変化〉がもたらす価値</div>
  <h2 class="s-title">〈変化の価値を1文で〉</h2>
  <div class="s-rule"></div>
  <div class="s-body">
    <div class="gap gap--tb">
      <div class="gap-panel">
        <div class="gap-label">BEFORE</div>
        <div class="gap-list"><div class="gap-item">〈変化前〉</div></div>
      </div>
      <div class="gap-arrow">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <path d="M6 20h22M22 12l8 8-8 8" fill="none" stroke="#15C176" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="gap-panel to">
        <div class="gap-label">AFTER</div>
        <div class="gap-list"><div class="gap-item">〈変化後〉</div></div>
      </div>
    </div>
  </div>
  <div class="s-foot">
    <div class="s-src">出典: 〈出典・確認日〉</div>
    <div class="s-page">〈N〉</div>
  </div>
</section>

<div class="notes"><span class="notes-label">SPEAKER NOTES</span>
<b>左右で行数を必ず揃える。</b><b>左（現状）を過度に悪く描かない</b>——相手はそれを守りにかかる。<b>「見込み」は見込みと書く</b>。</div>

</body>
</html>
