<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>main-5-07</title>
  <link rel="stylesheet" href="../slide-templates/slide-template.css">
  <style>
    .principle-band {
      background: var(--accent-soft);
      border: 1px solid #cfe5d3;
      border-left: 5px solid var(--accent);
      border-radius: 0 12px 12px 0;
      padding: 10px 18px;
      font-size: 16px;
      font-weight: 800;
      color: var(--accent-strong);
      text-align: center;
    }
    .gate-card {
      background: #ffffff;
      border: 1px solid var(--line-soft);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 6px;
    }
    .gate-card h3 {
      font-size: var(--body);
      font-weight: 800;
      color: var(--text-strong);
    }
    .gate-role {
      font-size: var(--body-sm);
      line-height: 1.5;
      color: var(--text-muted);
    }
    .gate-arrow {
      color: var(--accent);
      font-size: 16px;
      font-weight: 800;
    }
    .gate-check {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <div class="slide theme-section-5">
    <div class="slide-head">
      <div class="slide-title">AI下書きと人間承認を分ける責任設計</div>
      <div class="slide-message">AI利用は自動化より責任の置き場を明確にする設計である</div>
    </div>
    <div class="slide-body">
      <div class="principle-band">AIが下書きする → 人間が承認する → SPECに反映する</div>
      <div class="feature-grid-3" style="flex:1;">
        <div class="gate-card">
          <h3>要求整理</h3>
          <div class="gate-role"><strong>AI:</strong> 叩き台を作成</div>
          <div class="gate-arrow">↓</div>
          <div class="gate-role"><strong>人間:</strong> 妥当性を承認</div>
          <div class="gate-arrow">↓</div>
          <div class="gate-check">✓</div>
        </div>
        <div class="gate-card">
          <h3>設計判断</h3>
          <div class="gate-role"><strong>AI:</strong> 設計案を作成</div>
          <div class="gate-arrow">↓</div>
          <div class="gate-role"><strong>人間:</strong> 技術判断を承認</div>
          <div class="gate-arrow">↓</div>
          <div class="gate-check">✓</div>
        </div>
        <div class="gate-card">
          <h3>SPEC更新</h3>
          <div class="gate-role"><strong>AI:</strong> 更新案を作成</div>
          <div class="gate-arrow">↓</div>
          <div class="gate-role"><strong>人間:</strong> 最終承認</div>
          <div class="gate-arrow">↓</div>
          <div class="gate-check">✓</div>
        </div>
      </div>
      <div class="callout body" style="font-weight:700;">AIの出力が間違っていても承認で止まる。だから盲信にならない</div>
    </div>
    <div class="slide-footer">
      <span>Quality Mechanism 1</span>
      <span>Draft By AI, Approve By Human</span>
    </div>
  </div>
</body>
</html>
