<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>main-6-03</title>
  <link rel="stylesheet" href="../slide-templates/slide-template.css">
  <style>
    .ssot-layer {
      background: var(--accent-soft);
      border: 2px solid var(--accent);
      border-radius: 14px;
      padding: 14px 16px 12px;
    }
    .ssot-layer-title {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent-strong);
      text-align: center;
      margin-bottom: 10px;
    }
    .ssot-pair {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .ssot-card {
      background: #ffffff;
      border: 1px solid var(--line-soft);
      border-radius: 10px;
      padding: 10px 14px;
      text-align: center;
    }
    .ssot-card h3 {
      font-size: var(--body);
      font-weight: 800;
      color: var(--text-strong);
      margin-bottom: 4px;
    }
    .ssot-card p {
      font-size: var(--body-sm);
      color: var(--text-muted);
      line-height: 1.5;
    }
    .ssot-note {
      font-size: var(--body-sm);
      color: var(--accent-strong);
      font-weight: 700;
      text-align: center;
      margin-top: 8px;
    }
    .output-layer {
      background: #f9fbfb;
      border: 1px solid var(--line-soft);
      border-radius: 14px;
      padding: 14px 16px 12px;
    }
    .output-layer-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 10px;
    }
    .output-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .output-item {
      background: #ffffff;
      border: 1px solid var(--line-soft);
      border-radius: 8px;
      padding: 8px 6px;
      font-size: var(--body-sm);
      font-weight: 600;
      text-align: center;
      color: var(--text-strong);
    }
    .layer-arrow {
      text-align: center;
      font-size: 20px;
      font-weight: 800;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div class="slide theme-section-6">
    <div class="slide-head">
      <div class="slide-title">正しい知識と生成物の保存対象を分ける設計</div>
      <div class="slide-message">保存すべきは成果物でなく再生成を支える正しい知識の方である</div>
    </div>
    <div class="slide-body">
      <div class="ssot-layer">
        <div class="ssot-layer-title">SSOT層: SPEC & Project</div>
        <div class="ssot-pair">
          <div class="ssot-card">
            <h3>SPEC</h3>
            <p>現在の正しい知識<br>仕様・設計・構造</p>
          </div>
          <div class="ssot-card">
            <h3>Project</h3>
            <p>変更の文脈<br>要件・判断理由・経緯</p>
          </div>
        </div>
        <div class="ssot-note">両方が揃って初めてSSOTが成立する</div>
      </div>
      <div class="layer-arrow">↓</div>
      <div class="output-layer">
        <div class="output-layer-title">アウトプット層: 目的別にAIが生成（使い捨て）</div>
        <div class="output-grid">
          <div class="output-item">レビュー資料</div>
          <div class="output-item">新メンバー説明</div>
          <div class="output-item">顧客向け報告</div>
          <div class="output-item">開発用コンテキスト</div>
        </div>
      </div>
      <div class="callout body" style="font-weight:700;">SSOTが正しければ何度でも再生成できる。成果物は使い捨て、知識だけを守る</div>
    </div>
    <div class="slide-footer">
      <span>Two Layers</span>
      <span>Storage And Output</span>
    </div>
  </div>
</body>
</html>
