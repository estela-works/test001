<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>main-0-07</title>
  <link rel="stylesheet" href="../slide-templates/slide-template.css">
  <style>
    .profile-layout {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 28px;
      flex: 1;
    }

    .profile-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .profile-name {
      font-size: 36px;
      font-weight: 800;
      color: var(--text-strong);
      letter-spacing: 0.08em;
    }

    .profile-title {
      font-size: 16px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .profile-services {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .profile-pill {
      background: var(--panel-soft);
      border: 1px solid var(--line-soft);
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-body);
    }

    .profile-ai-card {
      background: var(--accent-soft);
      border: 1px solid #c0e0c6;
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      padding: 14px 22px;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .profile-ai-card .card-heading {
      font-size: 15px;
      font-weight: 800;
      color: var(--accent-strong);
    }

    .profile-ai-card .card-body {
      font-size: 14px;
      line-height: 1.6;
      color: var(--text-body);
    }

    .profile-note {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="slide theme-section-0">
    <div class="slide-head">
      <div class="slide-title">自己紹介</div>
      <div class="slide-message">今日の話は実践者の視点からお伝えします</div>
    </div>
    <div class="slide-body">
      <div class="profile-layout">
        <div class="profile-header">
          <div class="profile-name">春風 卓</div>
          <div class="profile-title">ESTELA WORKS株式会社 代表取締役</div>
        </div>
        <div class="profile-services">
          <div class="profile-pill">ITコンサルティング</div>
          <div class="profile-pill">AI活用支援</div>
          <div class="profile-pill">システム開発</div>
        </div>
        <div class="profile-ai-card">
          <div class="card-heading">AIを日常的に使い倒しています</div>
          <div class="card-body">動画コンテンツのフルAI制作、開発プロセスへのAI統合など、日々実験と試行錯誤を繰り返しています。今日お話しするSPEC&Project方式も、自分の現場で実際に運用しているものです。</div>
        </div>
        <div class="profile-note">理論ではなく実践から得た知見をお伝えします</div>
      </div>
    </div>
  </div>
</body>
</html>
