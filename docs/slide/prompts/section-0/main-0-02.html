<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>main-0-02</title>
  <link rel="stylesheet" href="../slide-templates/slide-template.css">
  <style>
    .slide-body {
      gap: 10px;
    }

    .question-panel {
      gap: 8px;
    }

    .lead-card {
      padding: 14px 18px;
    }

    .lead-question {
      font-size: 22px;
      line-height: 1.35;
    }

    .lead-support {
      margin-top: 8px;
      font-size: 16px;
      line-height: 1.5;
    }

    .question-panel .misconception-list.card {
      padding: 8px 18px;
    }

    .question-panel .misconception + .misconception {
      padding-top: 8px;
    }

    .misconception {
      font-size: 18px;
      line-height: 1.4;
    }

    .wrong-badge {
      min-width: 58px;
      padding: 5px 10px;
      border-radius: 999px;
      background: #eef2f2;
      color: var(--old-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      flex: 0 0 auto;
    }

    .native-note {
      font-size: 18px;
      line-height: 1.45;
      font-weight: 700;
      color: var(--text-strong);
    }
  </style>
</head>
<body>
  <div class="slide theme-section-0">
    <div class="slide-head">
      <div class="slide-title">AIネイティブ開発という言葉の意味</div>
      <div class="slide-message">AIを多用する話でなく前提転換を問う言葉である</div>
    </div>
    <div class="slide-body">
      <div class="lead-card">
        <div class="lead-question">最初に出やすい答え</div>
        <div class="lead-support">AIをたくさん使うこと？ Copilotで爆速コーディング？ プロンプトが上手いこと？</div>
      </div>
      <div class="question-panel">
        <div class="misconception-list card">
          <div class="misconception">
            <span>インターネットネイティブ ＝ 検索が速い人？</span>
            <span class="wrong-badge">誤解</span>
          </div>
          <div class="misconception">
            <span>クラウドネイティブ ＝ AWSに詳しい人？</span>
            <span class="wrong-badge">誤解</span>
          </div>
        </div>
        <div class="native-note">どれも本質ではない</div>
      </div>
      <div class="callout big-conclusion">○○ネイティブには共通する構造がある</div>
    </div>
  </div>
</body>
</html>
